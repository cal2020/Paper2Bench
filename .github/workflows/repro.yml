name: Optional reproducibility core

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Repro core / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the optional core and API test dependencies
        run: python -m pip install -e '.[dev,repro,repro-api]'
      - name: Run the core tests without Docker or paid model calls
        run: python -m pytest -q tests/repro -m 'not docker' --junitxml="${{ runner.temp }}/repro-unit.xml"
      - name: Save test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repro-unit-python-${{ matrix.python }}
          path: ${{ runner.temp }}/repro-unit.xml
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Repro core / isolated Docker execution
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install the optional core and API test dependencies
        run: python -m pip install -e '.[dev,repro,repro-api]'
      - name: Explicitly stage the Python image for this CI run
        shell: bash
        run: |
          docker --host=unix:///var/run/docker.sock version
          docker --host=unix:///var/run/docker.sock pull python:3.12-slim
          p2b_image="$(docker --host=unix:///var/run/docker.sock image inspect --format '{{.Id}}' python:3.12-slim)"
          printf '%s\n' "PAPER2BENCH_DOCKER_IMAGE=$p2b_image" >> "$GITHUB_ENV"
      - name: Stage the bounded PDF parser from the installed dependency
        shell: bash
        run: |
          p2b_parser_image="$(python -c 'import os; from paper2bench.repro.parsers import prepare_parser_image; print(prepare_parser_image(os.environ["PAPER2BENCH_DOCKER_IMAGE"]))')"
          printf '%s\n' "PAPER2BENCH_PARSER_IMAGE=$p2b_parser_image" >> "$GITHUB_ENV"
      - name: Exercise actual isolation, PDF parsing, remote protocol and replay
        run: python -m pytest -q tests/repro -m docker --junitxml="${{ runner.temp }}/repro-docker.xml"
      - name: Save test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: repro-docker-python-3.12
          path: ${{ runner.temp }}/repro-docker.xml
          if-no-files-found: ignore
          retention-days: 7
