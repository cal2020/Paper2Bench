<!doctype html>
<html lang="en" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper2Bench — example</title>
<meta name="description" content="Paper2Bench detail view: the parsed tree and the diff between instruction.txt and instruction_gt.txt for a single example paper.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="site-styles.css">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script type="text/babel" src="site-reveal.jsx"></script>
<script type="text/babel" src="site-walkthrough.jsx"></script>
<script type="text/babel" src="site-diff.jsx"></script>
<script type="text/babel" src="site-app.jsx"></script>
<script type="text/babel" src="example-app.jsx"></script>

</head>
<body>
<div id="root"></div>

<script type="text/babel">
  // Pick the paper from ?paper=<id>; default to first.
  (function () {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('paper');
    if (id && window.P2B_findPaper) {
      window.P2B_DATA.current = window.P2B_findPaper(id);
    }
    // Apply saved mode pre-paint
    try {
      const m = localStorage.getItem('p2b-mode');
      if (m) document.documentElement.setAttribute('data-mode', m);
    } catch {}
  })();

  function tryMount() {
    if (!window.ExampleApp || !window.Walkthrough || !window.FullDiff || !window.Nav || !window.Footer) {
      return setTimeout(tryMount, 30);
    }
    document.title = `Paper2Bench · ${window.P2B_DATA.current.title}`;
    ReactDOM.createRoot(document.getElementById('root')).render(<window.ExampleApp />);
  }
  tryMount();
</script>

</body>
</html>
