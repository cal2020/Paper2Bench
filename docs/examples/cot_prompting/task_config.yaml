task_id: cot_prompting
research_question: Does chain-of-thought prompting improve LLM reasoning on arithmetic, commonsense, and symbolic tasks?
models:
  api:
    - text-ada-001
    - text-babbage-001
    - text-curie-001
    - text-davinci-002
  huggingface:
    - google/paLM
api_key_var: OPENAI_API_KEY
budget_per_model: 1000
datasets:
  - name: "GSM8K"
    source: huggingface
    loader: |
      from datasets import load_dataset
      dataset = load_dataset("openai/grade-school-math")
    description: "A benchmark of math word problems."
  - name: "SVAMP"
    source: huggingface
    loader: |
      from datasets import load_dataset
      dataset = load_dataset("arkilpatel/SVAMP")
    description: "A dataset of math word problems with varying structures."
  - name: "ASDiv"
    source: huggingface
    loader: |
      from datasets import load_dataset
      dataset = load_dataset("chaochun/nlu-asdiv-dataset")
    description: "A diverse dataset of math word problems."
  - name: "AQuA"
    source: huggingface
    loader: |
      from datasets import load_dataset
      dataset = load_dataset("deepmind/AQuA")
    description: "A dataset of algebraic word problems."
  - name: "MAWPS"
    source: huggingface
    loader: |
      from datasets import load_dataset
      dataset = load_dataset("koncel-kedziorski/MAWPS")
    description: "A math word problem repository."
  - name: "CSQA"
    source: huggingface
    loader: |
      from datasets import load_dataset
      dataset = load_dataset("commonsenseqa")
    description: "A commonsense question answering benchmark."
  - name: "StrategyQA"
    source: huggingface
    loader: |
      from datasets import load_dataset
      dataset = load_dataset("strategyqa")
    description: "A question answering benchmark requiring multi-hop reasoning."
  - name: "SayCan"
    source: huggingface
    loader: |
      from datasets import load_dataset
      dataset = load_dataset("say-can")
    description: "A dataset for instructing a robot."
constraints:
  - "Do NOT use web search"
  - "Run FULL end-to-end experiments"