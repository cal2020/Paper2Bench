task_id: lost_in_the_middle
research_question: Do LLMs degrade when relevant information is placed in the middle of long input contexts?
models:
  api:
    - gpt-3.5-turbo-0613
    - claude-1.3
  huggingface:
    - meta-llama/MPT-30B-Instruct
    - meta-llama/LongChat-13B-16K
api_key_var: OPENAI_API_KEY
budget_per_model: 1000
datasets:
  - name: "NaturalQuestions-Open"
    source: huggingface
    loader: |
      from datasets import load_dataset
      dataset = load_dataset("natural_questions", split="train")
    description: "A dataset containing historical queries issued to the Google search engine, with human-annotated answers extracted from Wikipedia."
  - name: "Synthetic JSON key-value pairs"
    source: synthetic
    loader: |
      import json
      import random
      def generate_synthetic_kv_pairs(num_pairs):
          return {str(i): str(random.uuid4()) for i in range(num_pairs)}
    description: "A synthetic dataset consisting of key-value pairs formatted as JSON, where keys and values are unique randomly-generated UUIDs."
constraints:
  - "Do NOT use web search"
  - "Run FULL end-to-end experiments"