[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2bench"
version = "0.4.0a2"
description = "Convert academic papers into benchmark tasks for evaluating AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Abhay Anand"},
    {name = "Zhongyan Li"},
    {name = "Zhen Wang"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "arxiv>=2.0",
    "openai>=1.0",
    "pymupdf>=1.23",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/cal2020/Paper2Bench"
Issues = "https://github.com/cal2020/Paper2Bench/issues"
Upstream = "https://github.com/AbhayAnandUCSD/Paper2Bench"

[project.scripts]
paper2bench = "paper2bench.cli:main"

[tool.setuptools.packages.find]
include = ["paper2bench*"]

[tool.setuptools.package-data]
paper2bench = ["templates/*.txt", "schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: requires the local Docker engine and a staged Python image"]
