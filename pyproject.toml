[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper2bench"
version = "0.3.0"
description = "Convert academic papers into benchmark tasks for evaluating AI agents."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Abhay Anand"},
    {name = "Zhongyan Li"},
]
dependencies = [
    "arxiv>=2.0",
    "openai>=1.0",
    "pymupdf>=1.23",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]

[project.urls]
Homepage = "https://github.com/AbhayAnandUCSD/Paper2Bench"
Issues = "https://github.com/AbhayAnandUCSD/Paper2Bench/issues"

[project.scripts]
paper2bench = "paper2bench.cli:main"

[tool.setuptools.packages.find]
include = ["paper2bench*"]

[tool.setuptools.package-data]
paper2bench = ["templates/*.txt"]
